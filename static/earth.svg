<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Clip path to keep continents and ice cap cleanly inside the ocean circle -->
    <clipPath id="earth-clip">
      <circle cx="32" cy="32" r="28" />
    </clipPath>
  </defs>

  <!-- Ocean base -->
  <circle cx="32" cy="32" r="28" fill="#3B82F6" />

  <g clip-path="url(#earth-clip)">
    <!-- Continents (flat, solid shapes) -->
    <g fill="#22C55E">
      <!-- North America -->
      <path d="M 10,12 Q 20,8 26,14 T 24,24 Q 20,28 22,33 L 17,33 Q 13,26 8,22 Z" />
      <!-- South America -->
      <path d="M 22,35 Q 29,36 31,42 T 26,56 L 22,56 Q 20,46 21,39 Z" />
      <!-- Europe & Asia -->
      <path d="M 35,11 Q 48,8 56,15 T 54,28 Q 46,32 42,27 Q 37,25 34,21 Z" />
      <!-- Africa -->
      <path d="M 35,26 Q 44,26 47,33 T 42,48 L 38,48 Q 35,39 34,32 Z" />
      <!-- Australia -->
      <path d="M 48,41 Q 55,40 57,45 T 51,51 Q 47,49 48,44 Z" />
    </g>

    <!-- North Pole ice cap -->
    <path d="M 16,4 H 48 V 9 Q 40,12 32,9.5 T 16,9 Z" fill="#F8FAFC" />
  </g>
</svg>